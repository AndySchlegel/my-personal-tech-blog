# Security Scanning Pipeline
#
# Runs on every push and PR to main/develop.
# Three independent jobs (run in parallel):
#   1. Trufflehog - Scans git history for leaked secrets
#   2. tfsec     - Static security analysis for Terraform code
#   3. Checkov   - Policy-as-code checks (CIS, AWS best practices)
#
# All findings triaged: real fixes applied, accepted risks suppressed
# with inline #checkov:skip comments. soft_fail=false enforces as PR guardrails.

name: "Security Scanning"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # -----------------------------------------------
  # Trufflehog - Scans git history for leaked secrets
  # -----------------------------------------------
  trufflehog:
    name: Secret Detection (Trufflehog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # -----------------------------------------------
  # tfsec - Static security scanner for Terraform
  # Catches issues like open security groups, unencrypted
  # storage, overly permissive IAM policies, etc.
  # -----------------------------------------------
  tfsec:
    name: Terraform Security (tfsec)
    runs-on: ubuntu-latest
    strategy:
      # One scan per Terraform root. terraform-lightsail is intentionally
      # not listed yet: it predates the scan matrix and gets triaged
      # before joining, so a backlog of old findings cannot block PRs.
      matrix:
        tf_root: [terraform, terraform-ec2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ matrix.tf_root }}
          soft_fail: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------
  # Checkov - Policy-as-code for Terraform
  # Checks against CIS benchmarks, AWS security best
  # practices, and common misconfigurations.
  # -----------------------------------------------
  checkov:
    name: Policy Checks (Checkov)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tf_root: [terraform, terraform-ec2] # same note as tfsec: lightsail joins after triage
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.tf_root }}
          framework: terraform
          soft_fail: false
